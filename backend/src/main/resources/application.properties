spring.application.name=seatlock
server.port=${SERVER_PORT}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS}
# Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.schemas=flyway,catalogue,inventory,booking
spring.flyway.default-schema=flyway
# Seat holds (inventory HoldStore)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
# JWTs from Keycloak: keys fetched over the Docker network, issuer only compared (it is the browser-facing URL)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE}
# Our own token for calls to the payment service (client credentials)
spring.security.oauth2.client.registration.seatlock.client-id=${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.seatlock.client-secret=${OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.seatlock.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.seatlock.token-uri=${OAUTH_TOKEN_URI}
payment.base-url=${PAYMENT_URL}
# Booking events (outbox relay -> Kafka). Kafka down: a send gives up after a few seconds and retries next run.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
# Milliseconds between relay runs
outbox.relay-interval=500
# Payment service calls (PaymentClient). Bulkhead: at most N checkout calls at once and none queue,
# so a slow payment service can't hold every request thread.
resilience4j.bulkhead.instances.payment.max-concurrent-calls=${PAYMENT_MAX_CONCURRENT_CALLS}
resilience4j.bulkhead.instances.payment.max-wait-duration=0
# Circuit breaker: over the last 10 calls (judged from 5), half failed or slower than 3 s -> refuse calls
# for 30 s, then let 2 trial calls decide. 4xx answers mean a bad request, not a sick service.
resilience4j.circuitbreaker.instances.payment.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.payment.sliding-window-size=10
resilience4j.circuitbreaker.instances.payment.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.payment.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.payment.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.instances.payment.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.payment.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.payment.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.payment.record-exceptions=org.springframework.web.client.RestClientException,org.springframework.security.oauth2.core.OAuth2AuthorizationException
resilience4j.circuitbreaker.instances.payment.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.oauth.client-id=${SWAGGER_OAUTH_CLIENT_ID}
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid
# Metrics for Prometheus
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.metrics.distribution.percentiles-histogram.hikaricp.connections=true
server.tomcat.mbeanregistry.enabled=true
# Behind the gateway: client address and scheme from X-Forwarded-*, trusted only from private networks
server.forward-headers-strategy=native
