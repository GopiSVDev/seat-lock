# Values for the env-var placeholders in application.properties; Postgres and Redis come from Testcontainers
SERVER_PORT=0
DB_URL=jdbc:postgresql://replaced-by-testcontainers/test
DB_USERNAME=test
DB_PASSWORD=test
DB_POOL_SIZE=10
# Small, so PaymentResilienceTest needs few parallel checkouts; the bulkhead must stay below the threads
TOMCAT_MAX_THREADS=20
PAYMENT_MAX_CONCURRENT_CALLS=10
# Short, so the recovery test waits briefly
resilience4j.circuitbreaker.instances.payment.wait-duration-in-open-state=1s
REDIS_HOST=replaced-by-testcontainers
REDIS_PORT=6379
# Never contacted: tests replace the JwtDecoder (see TestInfrastructure)
JWT_JWK_SET_URI=http://localhost/unused
JWT_ISSUER_URI=http://localhost/unused
JWT_AUDIENCE=seatlock-api
SWAGGER_OAUTH_CLIENT_ID=seatlock-web
# Keycloak's token endpoint and the payment service are WireMock (see IntegrationTest)
OAUTH_CLIENT_ID=seatlock-backend
OAUTH_CLIENT_SECRET=test-client-secret
OAUTH_TOKEN_URI=http://localhost/replaced-by-wiremock
PAYMENT_URL=http://localhost/replaced-by-wiremock
