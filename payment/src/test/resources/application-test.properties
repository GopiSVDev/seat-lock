# Values for the env-var placeholders in application.properties; Postgres comes from Testcontainers,
# Razorpay, Keycloak's token endpoint and the backend from WireMock (see IntegrationTest)
SERVER_PORT=0
DB_URL=jdbc:postgresql://replaced-by-testcontainers/test
DB_USERNAME=test
DB_PASSWORD=test
# Never contacted: tests replace the JwtDecoder (see TestInfrastructure)
JWT_JWK_SET_URI=http://localhost/unused
JWT_ISSUER_URI=http://localhost/unused
JWT_AUDIENCE=seatlock-payment-api
OAUTH_CLIENT_ID=seatlock-payment
OAUTH_CLIENT_SECRET=test-client-secret
OAUTH_TOKEN_URI=http://localhost/replaced-by-wiremock
RAZORPAY_BASE_URL=http://localhost/replaced-by-wiremock
RAZORPAY_KEY_ID=rzp_test_key
RAZORPAY_KEY_SECRET=test-key-secret
RAZORPAY_WEBHOOK_SECRET=test-webhook-secret
BACKEND_URL=http://localhost/replaced-by-wiremock
