spring.application.name=payment
server.port=${SERVER_PORT}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Flyway owns the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.schemas=flyway,payment
spring.flyway.default-schema=flyway
# Tokens of calling services (the backend), checked like the backend checks user tokens
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE}
# Our own token for calls to the backend (client credentials)
spring.security.oauth2.client.registration.seatlock.client-id=${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.seatlock.client-secret=${OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.seatlock.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.seatlock.token-uri=${OAUTH_TOKEN_URI}
razorpay.base-url=${RAZORPAY_BASE_URL}
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}
backend.base-url=${BACKEND_URL}
# Metrics for Prometheus
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Behind the gateway: client address and scheme from X-Forwarded-*, trusted only from private networks
server.forward-headers-strategy=native
