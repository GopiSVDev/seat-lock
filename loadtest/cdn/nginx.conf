# One CDN edge server for the load tests, on the laptop like k6: it caches what the app marks as
# cacheable (the seat map layout: Cache-Control public, max-age, immutable) and asks the VM on a miss.
# The cache is in a tmpfs, so restarting the container gives a cold CDN.

worker_processes 2; # pinned to CPUs 8-9 in docker-compose.yml
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 16384;
}

http {
    access_log off;
    keepalive_requests 100000;
    keepalive_timeout 75s;

    proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge:10m max_size=200m inactive=1d use_temp_path=off;

    # Rendered from edge.conf.template (VM address) by the image's entrypoint
    include /etc/nginx/edge/*.conf;
}
