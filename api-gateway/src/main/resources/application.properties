spring.application.name=api-gateway
server.port=${SERVER_PORT}
backend.base-url=${BACKEND_URL}
payment.base-url=${PAYMENT_URL}
# X-Forwarded-* is added only for callers matching this: loopback and private networks (Docker's port
# mapping, the cloudflared tunnel). Without it the filter is off and the services never see the client.
spring.cloud.gateway.server.webmvc.trusted-proxies=127\\..*|10\\..*|172\\.(1[6-9]|2[0-9]|3[01])\\..*|192\\.168\\..*|0:0:0:0:0:0:0:1
# Above the backend's own 7 s wait on the payment service, so its answer still gets through
gateway.read-timeout=10s
# Actuator on its own port, never published: the public port serves routes only
management.server.port=${MANAGEMENT_PORT}
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
