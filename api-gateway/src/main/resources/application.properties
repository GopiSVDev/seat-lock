spring.application.name=api-gateway
server.port=${SERVER_PORT}
backend.base-url=${BACKEND_URL}
payment.base-url=${PAYMENT_URL}
# Above the backend's own 15 s wait on the payment service, so its answer still gets through
gateway.read-timeout=20s
# Actuator on its own port, never published: the public port serves routes only
management.server.port=${MANAGEMENT_PORT}
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
