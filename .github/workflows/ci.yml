name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [backend, payment, notification, api-gateway]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.app }}/pom.xml

      # Testcontainers uses the runner's Docker for PostgreSQL, Redis and Kafka
      - name: Format check, tests and coverage
        run: mvn -B -ntp spotless:check verify

      - name: Coverage summary
        run: |
          awk -F, 'NR > 1 { missed += $8; covered += $9 }
            END { printf "### ${{ matrix.app }}: %.1f%% line coverage (%d of %d lines)\n", 100 * covered / (missed + covered), covered, missed + covered }' \
            target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: ${{ matrix.app }}/target/site/jacoco

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.app }}
          path: ${{ matrix.app }}/target/surefire-reports

      # The Dockerfile is not exercised by the tests; this catches a broken image build
      - name: Docker image builds
        run: docker build -t seatlock-${{ matrix.app }}:ci .

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_OIDC_AUTHORITY: http://localhost:8180/realms/seatlock

      # The Playwright smoke test needs the whole stack and Razorpay keys, so it runs locally (web-e2e)
      - name: Docker image builds
        run: docker build --build-arg VITE_OIDC_AUTHORITY=http://localhost:8180/realms/seatlock -t seatlock-web:ci .
