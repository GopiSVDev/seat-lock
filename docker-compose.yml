services:
  postgres:
    image: postgres:16-alpine
    container_name: seat-lock-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      # Read by postgres/payment-db.sh
      PAYMENT_DB: ${PAYMENT_DB:?PAYMENT_DB is not set}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:?PAYMENT_DB_USER is not set}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD is not set}
    # pg_stat_statements: per-statement stats for postgres-exporter (load tests)
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
      ]
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is not set}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./monitoring/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./postgres/payment-db.sh:/docker-entrypoint-initdb.d/20-payment-db.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is not set} -d ${POSTGRES_DB:?POSTGRES_DB is not set}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Seat holds. noeviction: a full Redis refuses new holds instead of dropping live ones.
  # No persistence: holds last 5 minutes; after a restart buyers just pick their seats again.
  redis:
    image: redis:8.2.1-alpine
    container_name: seat-lock-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: seat-lock-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:?BACKEND_PORT is not set}:${BACKEND_PORT:?BACKEND_PORT is not set}"
    environment:
      # Heap as a share of the machine's RAM, leaving room for Postgres (512 MB on the 2 GB VM)
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=25
      SERVER_PORT: ${BACKEND_PORT:?BACKEND_PORT is not set}
      DB_POOL_SIZE: ${DB_POOL_SIZE:?DB_POOL_SIZE is not set}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:?TOMCAT_MAX_THREADS is not set}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is not set}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is not set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:?JWT_JWK_SET_URI is not set}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?JWT_ISSUER_URI is not set}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE is not set}
      SWAGGER_OAUTH_CLIENT_ID: ${SWAGGER_OAUTH_CLIENT_ID:?SWAGGER_OAUTH_CLIENT_ID is not set}
      OAUTH_TOKEN_URI: http://keycloak:8080/realms/seatlock/protocol/openid-connect/token
      OAUTH_CLIENT_ID: seatlock-backend
      OAUTH_CLIENT_SECRET: ${BACKEND_CLIENT_SECRET:?BACKEND_CLIENT_SECRET is not set}
      PAYMENT_URL: http://payment:${PAYMENT_PORT:?PAYMENT_PORT is not set}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:$${SERVER_PORT}/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Payment service: own database (same Postgres container), talks to Razorpay; the backend calls it
  payment:
    build:
      context: ./payment
    container_name: seat-lock-payment
    restart: unless-stopped
    ports:
      - "${PAYMENT_PORT:?PAYMENT_PORT is not set}:${PAYMENT_PORT:?PAYMENT_PORT is not set}"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=25
      SERVER_PORT: ${PAYMENT_PORT:?PAYMENT_PORT is not set}
      DB_URL: jdbc:postgresql://postgres:5432/${PAYMENT_DB:?PAYMENT_DB is not set}
      DB_USERNAME: ${PAYMENT_DB_USER:?PAYMENT_DB_USER is not set}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD is not set}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:?JWT_JWK_SET_URI is not set}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?JWT_ISSUER_URI is not set}
      # Only tokens minted for this service (the backend's client adds this audience)
      JWT_AUDIENCE: seatlock-payment-api
      OAUTH_TOKEN_URI: http://keycloak:8080/realms/seatlock/protocol/openid-connect/token
      OAUTH_CLIENT_ID: seatlock-payment
      OAUTH_CLIENT_SECRET: ${PAYMENT_CLIENT_SECRET:?PAYMENT_CLIENT_SECRET is not set}
      BACKEND_URL: http://backend:${BACKEND_PORT:?BACKEND_PORT is not set}
      RAZORPAY_BASE_URL: https://api.razorpay.com
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?RAZORPAY_KEY_ID is not set}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?RAZORPAY_KEY_SECRET is not set}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?RAZORPAY_WEBHOOK_SECRET is not set}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:$${SERVER_PORT}/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Dev mode; production would run `start` with HTTPS and its own database
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: seat-lock-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is not set}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is not set}
      # Same token issuer whether reached as localhost:8180 or keycloak:8080
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:?KEYCLOAK_PORT is not set}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Client secrets of the services, filled into the realm file on import
      BACKEND_CLIENT_SECRET: ${BACKEND_CLIENT_SECRET:?BACKEND_CLIENT_SECRET is not set}
      PAYMENT_CLIENT_SECRET: ${PAYMENT_CLIENT_SECRET:?PAYMENT_CLIENT_SECRET is not set}
    ports:
      - "${KEYCLOAK_PORT:?KEYCLOAK_PORT is not set}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      # No curl in the image
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --- Tests: docker compose run --rm backend-test ---
  # Maven in a container; Testcontainers starts its own Postgres and Redis through the Docker socket (dev/CI only:
  # socket access is root on the host). Sources are copied, so the build writes nothing into ./backend.
  backend-test:
    image: maven:3.9.16-eclipse-temurin-25
    profiles: [test]
    working_dir: /app
    volumes:
      - ./backend:/src:ro
      - maven_repo:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Testcontainers' Postgres and Redis run beside this container; reach its published port through the host
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Only pom + src, like the Dockerfile: a host target/ (e.g. from the IDE) may hold stale classes
    command: ["sh", "-c", "cp /src/pom.xml /app/ && cp -r /src/src /app/ && mvn -B test"]

  # docker compose run --rm payment-test   (same setup as backend-test)
  payment-test:
    image: maven:3.9.16-eclipse-temurin-25
    profiles: [test]
    working_dir: /app
    volumes:
      - ./payment:/src:ro
      - maven_repo:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "-c", "cp /src/pom.xml /app/ && cp -r /src/src /app/ && mvn -B test"]

  # --- Load test monitoring: runs on the laptop, the app (postgres, backend) runs in the LXD VM ---
  # docker compose --profile monitoring up -d prometheus postgres-exporter
  # Host networking so Prometheus reaches the VM and k6 reaches Prometheus on localhost:9090.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: seat-lock-prometheus
    profiles: [monitoring]
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: seat-lock-postgres-exporter
    profiles: [monitoring]
    restart: unless-stopped
    network_mode: host
    command:
      - --collector.stat_statements
      - --collector.stat_statements.include_query
      - --collector.stat_statements.query_length=200
    environment:
      DATA_SOURCE_URI: ${VM_IP:?VM_IP is not set}:${POSTGRES_PORT:?POSTGRES_PORT is not set}/${POSTGRES_DB:?POSTGRES_DB is not set}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:?POSTGRES_USER is not set}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}

  # --- Load test CDN edge: caches the seat map layout in front of the VM (loadtest/cdn) ---
  # docker compose --profile cdn up -d cdn      (restart it for a cold CDN)
  # Pinned to CPUs 8-9, so k6 runs on 0-7 and the VM keeps CPU 10.
  cdn:
    image: nginx:1.28.0-alpine
    container_name: seat-lock-cdn
    profiles: [cdn]
    restart: unless-stopped
    network_mode: host
    cpuset: "8-9"
    environment:
      VM_IP: ${VM_IP:?VM_IP is not set}
      BACKEND_PORT: ${BACKEND_PORT:?BACKEND_PORT is not set}
      # Render the template outside conf.d, so the image's default server (port 80) isn't loaded
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/edge
    volumes:
      - ./loadtest/cdn/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./loadtest/cdn/edge.conf.template:/etc/nginx/templates/edge.conf.template:ro
    tmpfs:
      - /etc/nginx/edge
      - /var/cache/nginx/edge:size=256m

volumes:
  maven_repo:
  postgres_data:
  prometheus_data:
  keycloak_data:
