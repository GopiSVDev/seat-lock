spring.application.name=notification
server.port=${SERVER_PORT}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.schemas=flyway,notification
spring.flyway.default-schema=flyway
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=notification
# A new consumer group starts from the oldest event, so nothing sent before the first start is missed
spring.kafka.consumer.auto-offset-reset=earliest
# Health for compose; nothing else is served
management.endpoints.web.exposure.include=health,prometheus
